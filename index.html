<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcus Streetwear</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    .container {
      padding: 20px;
    }

    .product {
      background: #111;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    #cart {
      margin-top: 30px;
      border-top: 1px solid #333;
      padding-top: 20px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<header>
  MARCUS STREETWEAR
</header>

<div class="container">

  <div class="product">
    <h3>T-shirt Marcus Logo</h3>
    <p>25€</p>
    <button onclick="addToCart('T-shirt Marcus', 25)">Ajouter au panier</button>
  </div>

  <div class="product">
    <h3>Short Streetwear</h3>
    <p>30€</p>
    <button onclick="addToCart('Short Streetwear', 30)">Ajouter au panier</button>
  </div>

  <div class="product">
    <h3>Hoodie Marcus Premium</h3>
    <p>50€</p>
    <button onclick="addToCart('Hoodie Marcus', 50)">Ajouter au panier</button>
  </div>

  <div id="cart">
    <h2>Panier</h2>
    <div id="items"></div>
    <h3>Total : <span id="total">0</span>€</h3>

    <button onclick="checkout()">Payer maintenant</button>
  </div>

</div>

<script>
let cart = [];
let total = 0;

function addToCart(name, price) {
  cart.push({ name, price });
  total += price;
  renderCart();
}

function renderCart() {
  document.getElementById("items").innerHTML =
    cart.map((item, index) =>
      `<div class="item">
        <span>${item.name} - ${item.price}€</span>
        <button onclick="removeItem(${index})">X</button>
      </div>`
    ).join("");

  document.getElementById("total").innerText = total;
}

function removeItem(index) {
  total -= cart[index].price;
  cart.splice(index, 1);
  renderCart();
}

function checkout() {
  // 👉 remplace par ton vrai lien Stripe plus tard
  window.location.href = "TON-LIEN-STRIPE-ICI";
}
</script>

</body>
</html>
